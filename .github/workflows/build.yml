name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use the selected Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          swift --version

      - name: Test
        run: swift test

      - name: Build Docket.app
        run: |
          scripts/bundle.sh
          ditto -c -k --keepParent Docket.app Docket.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Docket
          path: Docket.zip
