name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'goals/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use the selected Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          swift --version

      - name: Test
        run: swift test

      - name: Build Docket.app
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Resources/Info.plist
          scripts/bundle.sh
          ditto -c -k --keepParent Docket.app Docket.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Docket
          path: Docket.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Docket.zip --target "$GITHUB_SHA" --title "Docket $VERSION" --generate-notes --notes "$(cat <<'NOTES'
          Download **Docket.zip**, unzip it and move **Docket.app** to /Applications.

          The app is ad-hoc signed, not notarized, so macOS blocks the first launch. Clear the quarantine flag once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Docket.app
          ```
          NOTES
          )"
